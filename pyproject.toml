[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-trajectory-rl"
version = "0.1.0"
description = "PKTD3-TD: 3-D UAV trajectory design via prior-knowledge-guided TD3, reproducing the IEEE TNSE paper of the same algorithm family."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
